[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pilot"
version = "0.1.0"
description = "Painel de vendas em Python com análise de métricas e assistente de IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openrouter>=1.3.117",
    "pandas>=2.0",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    "streamlit>=1.50",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
